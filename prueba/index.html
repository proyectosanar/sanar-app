      const cont = document.getElementById('lAvisosLista');
      const caja = document.getElementById('lAvisos');
      cont.innerHTML = '';
      const n = cantidadAvisosLiq(L);
      document.getElementById('lAvisosN').textContent = n;
      caja.hidden = n === 0 || E.cerrado;
      if (caja.hidden) return;

      const bloque = (titulo, items, boton) => {
        if (!items.length) return;
        const div = nodo('div');
        div.appendChild(nodo('p', 'font-semibold', titulo));
        const ul = nodo('ul', 'mt-1 space-y-1');
        for (const txt of items) ul.appendChild(nodo('li', 'break-words', txt));
        div.appendChild(ul);
        if (boton) {
          const b = nodo('button', 'mt-1 font-semibold underline min-h-[44px]', boton[0]);
          b.type = 'button';
          b.onclick = boton[1];
          div.appendChild(b);
        }
        cont.appendChild(div);
      };
      const av = L.avisos;
      const txtProd = p => p.producto + ' · ' + num(p.cantidad) + ' u. (' + p.personas.join(', ') + ')';
      bloque('Productos sin precio (no tienen grupo), hoy se pagan $ 0:', av.productosSinPrecio.map(txtProd),
        ['Asignarles grupo', () => { state.liqp.soloSinGrupo = true; irAParametros('productos'); }]);
      bloque('Productos que no están en la lista de precios:', av.productosSinCatalogo.map(txtProd),
        ['Agregarlos a la lista de precios', () => irAParametros('productos')]);

      if (av.personasNoListadas.length) {
        const div = nodo('div', 'space-y-2');
        div.appendChild(nodo('p', 'font-semibold', 'Registros con un nombre que no está en la lista de colaboradoras:'));
        const personas = L.filas.map(f => f.persona);
        for (const p of av.personasNoListadas) {
          const item = nodo('div', 'rounded-xl bg-white/70 border border-amber-200 p-3 space-y-2');
          item.appendChild(nodo('p', 'break-words', '«' + p.persona + '» cargó ' + p.registros + (p.registros === 1 ? ' registro.' : ' registros.') +
            (p.sugerencia ? ' ¿Es ' + p.sugerencia + '?' : '')));
          const fila = nodo('div', 'flex flex-wrap items-center gap-2');
          const sel = nodo('select', 'rounded-xl border border-amber-300 bg-white px-3 py-2 text-sm min-h-[44px] max-w-full');
          sel.setAttribute('aria-label', 'Colaboradora a la que se le asignan los registros de ' + p.persona);
          const vacia = nodo('option', null, 'Elegí a quién…');
          vacia.value = '';
          sel.appendChild(vacia);
          for (const nom of personas) {
            const o = nodo('option', null, nom);
            o.value = nom;
            sel.appendChild(o);
          }
          sel.value = p.sugerencia || '';
          const b = nodo('button', 'rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold px-4 py-2 text-sm min-h-[44px] disabled:opacity-60',
            p.sugerencia ? 'Sí, asignárselo' : 'Asignar');
          b.type = 'button';
          b.onclick = () => {
            if (!sel.value) return avisoFlotante('lAviso', 'Elegí a qué colaboradora se le asignan.', true);
            accionLiq({ action: 'liq_reasignar', mes: state.liq.mes, persona: p.persona, nueva: sel.value }, null, b);
          };
          const nueva = nodo('button', 'text-sm font-semibold underline min-h-[44px]', 'Es una colaboradora nueva');
          nueva.type = 'button';
          nueva.onclick = () => irAParametros('colaboradoras', { editando: 'colaboradoras:nuevo', prefijo: { nombre_completo: p.persona } });
          fila.append(sel, b, nueva);
          item.appendChild(fila);
          div.appendChild(item);
        }
        cont.appendChild(div);
      }
      if (av.diferenciasConteo) {
        bloque('Lo declarado no coincide con lo contado:', [av.diferenciasConteo + (av.diferenciasConteo === 1 ? ' producto' : ' productos') +
          ' de alguna colaboradora en algún día. Para pagar vale lo declarado hasta que lo revises.'],
          ['Revisar el cruce', () => { state.cruce.mes = state.liq.mes; state.cruce.soloRevisar = true; location.hash = '#/cruce'; }]);
      }
      if (L.diasLaborales == null) {
        bloque('Faltan los días laborales del mes:', ['Sin ese dato no se calculan inasistencias ni horas faltantes.'],
          ['Cargarlos', () => irAParametros('diasLaborales', { editando: 'diasLaborales:nuevo', prefijo: { mes: state.liq.mes } })]);
      }
    }

    function mountLiqResumen() {
      if (state.session.debeCambiarPin) { location.hash = '#/cambiar-pin'; return mountCambiarPin(); }
      if (!esGestion()) { location.hash = '#/'; return mountHome(); }

      showHeader(true);
      setHeader({ back: true, subtitle: 'Resumen del mes' });
      document.getElementById('btnBack').onclick = () => (location.hash = '#/liquidacion');
      const main = document.getElementById('main');
      main.innerHTML = '';
      main.appendChild(document.getElementById('tplLiqResumen').content.cloneNode(true));
      document.getElementById('lrImprimir').onclick = () => window.print();

      if (state.liq.datos && state.liq.datosMes === state.liq.mes) return renderLiqResumen();
      estadoEn('lrEstado', 'Calculando la liquidación…', true);
      api({ action: 'liquidacion', mes: state.liq.mes }).then(data => {
        state.liq.datos = data.liquidacion;
        state.liq.estado = data.estado;
        state.liq.datosMes = state.liq.mes;
        document.getElementById('lrEstado').hidden = true;
        renderLiqResumen();
      }).catch(err => estadoEn('lrEstado', err.message));
    }

    function renderLiqResumen() {
      const L = state.liq.datos;
      const E = state.liq.estado || {};
      const tbody = document.getElementById('lrFilas');
      if (!tbody || !L) return;
      document.getElementById('lrMes').textContent = mesTitulo(state.liq.mes);
      document.getElementById('lrSub').textContent = 'Proyecto Sanar · ' +
        (E.cerrado ? 'mes cerrado el ' + fechaHoraTxt((E.cuando || '').slice(0, 10)) : 'mes abierto: los montos todavía pueden cambiar') +
        ' · generado el ' + new Date().toLocaleDateString('es-AR') + (L.diasLaborales != null ? ' · ' + L.diasLaborales + ' días laborales' : '');
      tbody.innerHTML = '';
      L.filas.forEach((f, i) => {
        const tr = nodo('tr', 'border-b border-slate-100');
        const celda = (txt, clase) => tr.appendChild(nodo('td', 'py-1.5 pr-2 ' + (clase || ''), txt));
        celda(String(i + 1), 'text-slate-500');
        celda(f.persona, 'text-slate-900');
        celda(f.dni || '—', 'text-slate-600');
        celda(String(f.diasConCarga), 'text-right');
        celda(f.montoProduccion ? pesos(f.montoProduccion) : '—', 'text-right');
        celda(f.montoHoras ? pesos(f.montoHoras) : '—', 'text-right');
        celda(f.montoFijo ? pesos(f.montoFijo) : '—', 'text-right');
        celda(pesos(f.aPagar), 'text-right font-semibold text-slate-900');
        celda(f.observacion || '', 'text-slate-700');
        tbody.appendChild(tr);
      });
      const suma = campo => L.filas.reduce((acc, f) => acc + (f[campo] || 0), 0);
      document.getElementById('lrTotProd').textContent = pesos(suma('montoProduccion'));
      document.getElementById('lrTotHoras').textContent = pesos(suma('montoHoras'));
      document.getElementById('lrTotFijo').textContent = pesos(suma('montoFijo'));
      document.getElementById('lrTotal').textContent = pesos(L.totales.aPagar);
      document.getElementById('lrHoja').hidden = false;
    }

    function mountLiqDetalle(persona) {
      if (state.session.debeCambiarPin) { location.hash = '#/cambiar-pin'; return mountCambiarPin(); }
      if (!esGestion()) { location.hash = '#/'; return mountHome(); }

      showHeader(true);
      setHeader({ back: true, subtitle: 'Liquidación del mes' });
      document.getElementById('btnBack').onclick = () => (location.hash = '#/liquidacion');
      const main = document.getElementById('main');
      main.innerHTML = '';
      main.appendChild(document.getElementById('tplLiqDetalle').content.cloneNode(true));
      document.getElementById('ldNombre').textContent = persona;
      document.getElementById('ldMes').textContent = mesTitulo(state.liq.mes);
      state.liqd = { persona, datos: null, editando: '' };
      cargarLiqDetalle();
    }

    async function cargarLiqDetalle() {
      if (!state.liqd.datos) estadoEn('ldEstado', 'Cargando…', true);
      try {
        const data = await api({ action: 'liquidacion_detalle', mes: state.liq.mes, persona: state.liqd.persona });
        state.liqd.datos = data;
        document.getElementById('ldEstado').hidden = true;
        renderLiqDetalle();
      } catch (err) {
        estadoEn('ldEstado', err.message);
      }
    }

    // Después de un ajuste: se recalcula el detalle y la liquidación del mes se vuelve a pedir al volver
    async function ajusteDetalle(params) {
      const data = await api(params);
      state.liqd.editando = '';
      state.liq.datos = null;
      await cargarLiqDetalle();
      avisoFlotante('ldAviso', data.aviso);
    }

    function renderLiqDetalle() {
      const data = state.liqd.datos;
      const res = document.getElementById('ldResumen');
      const dias = document.getElementById('ldDias');
      if (!res || !data) return;
      const E = data.estado || {};
      const f = data.fila;
      document.getElementById('ldMes').textContent = mesTitulo(state.liq.mes) + ' · ' + (E.cerrado ? 'cerrado' : 'abierto');
      const cobra = [];
      if (f && f.montoProduccion) cobra.push('por producción');
      if (f && f.montoHoras) cobra.push('por hora');
      if (f && f.montoFijo) cobra.push('monto fijo');
      document.getElementById('ldDni').textContent = (data.dni ? 'DNI ' + Number(data.dni).toLocaleString('es-AR') : 'Sin DNI cargado') +
        (cobra.length ? ' · cobra ' + cobra.join(' y ') : '');

      res.innerHTML = '';
      const dato = (titulo, valor, sub, destacado) => {
        const d = nodo('div', 'rounded-2xl bg-white border border-slate-200 p-3 text-center' + (destacado ? ' col-span-2 sm:col-span-1' : ''));
        d.appendChild(nodo('div', 'text-xs uppercase tracking-wide text-slate-500', titulo));
        d.appendChild(nodo('div', (destacado ? 'text-xl' : 'text-lg') + ' font-bold text-slate-900', valor));
        if (sub) d.appendChild(nodo('div', 'text-xs text-slate-500', sub));
        res.appendChild(d);
      };
      if (f) {
        dato('A pagar', pesos(f.aPagar), '', true);
        dato('Producción', pesos(f.montoProduccion), num(f.cantProductos) + ' unidades');
        dato('Trabajo por hora', pesos(f.montoHoras), f.horasTrabajo ? n2(f.horasTrabajo) + ' h' : '');
        if (f.montoFijo) dato('Monto fijo', pesos(f.montoFijo));
        dato('Horas netas', n2(f.hsNetas), data.diasLaborales != null ? 'Mínimo del mes: ' + n2(data.diasLaborales * (data.horasMinimasPorDia || 6)) : '');
        dato('Días con carga', f.diasConCarga + (data.diasLaborales != null ? ' de ' + data.diasLaborales : ''));
        if (f.inasistencias != null) dato('Inasistencias', String(f.inasistencias));
        if (f.faltanteHsMinimas != null) dato('Faltan hs mín.', n2(f.faltanteHsMinimas));
        res.hidden = false;
      }

      // Observación del mes
      const obsWrap = document.getElementById('ldObsWrap');
      const obs = document.getElementById('ldObs');
      const bObs = document.getElementById('ldObsGuardar');
      const msg = document.getElementById('ldObsMsg');
      obsWrap.hidden = !f;
      obs.value = f ? f.observacion || '' : '';
      obs.readOnly = !!E.cerrado;
      bObs.hidden = !!E.cerrado;
      msg.hidden = !E.cerrado;
      msg.className = 'text-sm text-slate-500';
      msg.textContent = E.cerrado ? 'El mes está cerrado: la observación ya no se cambia.' : '';
      bObs.onclick = async () => {
        bObs.disabled = true;
        msg.hidden = true;
        try {
          const r = await api({ action: 'liq_observacion', mes: state.liq.mes, persona: state.liqd.persona, texto: obs.value.trim() });
          f.observacion = obs.value.trim();
          state.liq.datos = null;
          msg.className = 'text-sm font-semibold text-emerald-700';
          msg.textContent = r.aviso;
        } catch (err) {
          msg.className = 'text-sm font-semibold text-red-700';
          msg.textContent = err.message;
        } finally {
          msg.hidden = false;
          bObs.disabled = false;
        }
      };

      // Registros día por día, con «Corregir» en cada cantidad
      document.getElementById('ldDiasTit').hidden = !data.registros.length;
      document.getElementById('ldDiasSub').textContent = data.registros.length + (data.registros.length === 1 ? ' registro' : ' registros') +
        (E.cerrado ? '.' : ' · cada corrección queda registrada con su valor anterior y el motivo.');
      dias.innerHTML = '';
      if (!data.registros.length) {
        dias.appendChild(nodo('p', 'text-center py-10 text-slate-500', 'No tiene cargas en este mes.'));
        return;
      }
      for (const r of data.registros) {
        const card = nodo('article', 'bg-white rounded-2xl border border-slate-200 shadow-card p-4');
        const head = nodo('header', 'flex items-baseline justify-between gap-3');
        const tit = nodo('div', 'min-w-0');
        tit.appendChild(nodo('div', 'text-xs uppercase tracking-wide text-brand-700 font-semibold', r.dia_semana));
        tit.appendChild(nodo('div', 'font-bold text-slate-900', formatFechaLegible(r.fecha)));
        head.appendChild(tit);
        head.appendChild(nodo('div', 'text-lg font-bold text-slate-900 shrink-0', pesos(r.total)));
        card.appendChild(head);
        const info = [];
        if (r.ingreso != null || r.egreso != null) info.push(horaDecimal(r.ingreso) + ' → ' + horaDecimal(r.egreso));
        if (r.hsSalida) info.push('salió ' + n2(r.hsSalida) + ' h');
        info.push(n2(r.hsNetas) + ' hs netas');
        if (r.actividad) info.push(r.actividad);
        card.appendChild(nodo('p', 'text-sm text-slate-600 mt-1', info.join(' · ')));
        if (r.nombreCargado) card.appendChild(nodo('p', 'text-xs font-semibold text-amber-700 mt-1', 'Lo cargó como «' + r.nombreCargado + '»: se le asignó en la liquidación.'));
        const ul = nodo('ul', 'mt-2 border-t border-slate-100 pt-2 text-sm text-slate-700 divide-y divide-slate-100');
        for (const it of r.items) ul.appendChild(lineaCorregible(r, it, false, E));
        for (const t of r.trabajos) ul.appendChild(lineaCorregible(r, t, true, E));
        for (const a of r.anulados) ul.appendChild(lineaAnulada(a, E));
        if (ul.children.length) card.appendChild(ul);
        dias.appendChild(card);
      }
    }

    function botonChico(texto, fn, color) {
      const b = nodo('button', 'text-sm font-semibold underline min-h-[44px] px-1 disabled:opacity-60 ' + (color || 'text-brand-700'), texto);
      b.type = 'button';
      b.onclick = fn;
      return b;
    }

    async function deshacerCorreccion(id, boton) {
      boton.disabled = true;
      try {
        await ajusteDetalle({ action: 'liq_deshacer_correccion', id });
      } catch (err) {
        avisoFlotante('ldAviso', err.message, true);
        if (boton.isConnected) boton.disabled = false;
      }
    }

    // Un producto o un trabajo por hora del día, con su corrección (si tiene) y los botones para corregir
    function lineaCorregible(r, it, esTrabajo, E) {
      const clave = r.clave + '#' + it.columna;
      if (state.liqd.editando === clave) return editorCorreccion(r, it, esTrabajo);
      const li = nodo('li', 'py-1.5');
      const fila = nodo('div', 'flex justify-between gap-3');
      const izq = nodo('span', 'min-w-0 break-words');
      if (esTrabajo) {
        izq.textContent = (it.tipo || 'Trabajo por hora') + ' · ' + n2(it.horas) + ' h';
      } else {
        izq.appendChild(document.createTextNode(it.producto + ' · ' + num(it.cantidad) + ' × '));
        izq.appendChild(it.precio ? document.createTextNode(precioUnidad(it.precio)) : nodo('span', 'font-semibold text-amber-700', 'sin precio'));
      }
      fila.appendChild(izq);
      fila.appendChild(nodo('span', 'font-semibold text-slate-900 shrink-0', pesos(it.monto)));
      li.appendChild(fila);
      if (it.correccion) {
        li.appendChild(nodo('p', 'text-xs font-semibold text-amber-700', 'Corregido por la supervisora · antes ' + n2(it.correccion.antes) +
          (esTrabajo ? ' h' : '') + ' · ' + it.correccion.motivo));
      }
      if (!E.cerrado) {
        const acciones = nodo('div', 'flex gap-3');
        acciones.appendChild(botonChico(esTrabajo ? 'Corregir horas' : 'Corregir', () => { state.liqd.editando = clave; renderLiqDetalle(); }));
        if (it.correccion) {
          const b = botonChico('Deshacer corrección', () => deshacerCorreccion(it.correccion.id, b), 'text-slate-600');
          acciones.appendChild(b);
        }
        li.appendChild(acciones);
      }
      return li;
    }

    // Lo que se corrigió a 0: ya no suma, pero queda a la vista para poder deshacerlo
    function lineaAnulada(a, E) {
      const li = nodo('li', 'py-1.5');
      li.appendChild(nodo('p', 'text-slate-500 line-through break-words', a.item));
      li.appendChild(nodo('p', 'text-xs font-semibold text-amber-700', 'Corregido a 0 por la supervisora · antes ' + n2(a.correccion.antes) + ' · ' + a.correccion.motivo));
      if (!E.cerrado) {
        const b = botonChico('Deshacer corrección', () => deshacerCorreccion(a.correccion.id, b), 'text-slate-600');
        li.appendChild(b);
      }
      return li;
    }

    function editorCorreccion(r, it, esTrabajo) {
      const li = nodo('li', 'py-2');
      const form = nodo('form', 'rounded-xl border border-brand-200 bg-brand-50 p-3 space-y-3');
      const original = it.correccion ? it.correccion.antes : (esTrabajo ? it.horas : it.cantidad);
      const precio = esTrabajo ? (it.horas ? it.monto / it.horas : 0) : (it.precio || 0);
      form.appendChild(nodo('p', 'text-sm font-semibold text-slate-900 break-words',
        formatFechaLegible(r.fecha) + ' · ' + (esTrabajo ? it.tipo || 'Trabajo por hora' : it.producto)));
      form.appendChild(nodo('p', 'text-sm text-slate-700', 'Cargó: ' + n2(original) + (esTrabajo ? ' h' : ' unidades')));
      const campo = (label, tipo) => {
        const lab = nodo('label', 'block');
        lab.appendChild(nodo('span', 'text-xs font-medium text-slate-500 uppercase tracking-wide', label));
        const inp = nodo('input', LP_INPUT);
        inp.type = 'text';
        if (tipo) inp.inputMode = tipo;
        lab.appendChild(inp);
        form.appendChild(lab);
        return inp;
      };
      const inpValor = campo(esTrabajo ? 'Horas correctas' : 'Cantidad correcta', 'decimal');
      inpValor.value = String(esTrabajo ? it.horas : it.cantidad);
      const inpMotivo = campo('Motivo');
      inpMotivo.placeholder = esTrabajo ? 'Ej.: fueron 2 h, no 3' : 'Ej.: la contadora contó 150';
      inpMotivo.value = it.correccion ? it.correccion.motivo : '';
      const vista = nodo('p', 'text-sm text-slate-700');
      const actualizar = () => {
        const v = Number(inpValor.value.replace(',', '.'));
        vista.textContent = isFinite(v) && inpValor.value.trim() !== ''
          ? 'Nuevo subtotal: ' + pesos(v * precio) + (precio ? ' (' + precioUnidad(precio) + (esTrabajo ? ' la hora)' : ' por unidad)') : '')
          : '';
      };
      inpValor.addEventListener('input', actualizar);
      actualizar();
      form.appendChild(vista);
      const error = nodo('p', 'text-sm font-semibold text-red-700');
      error.hidden = true;
      form.appendChild(error);
      const botones = nodo('div', 'flex flex-wrap gap-2');
      const bGuardar = nodo('button', 'rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-semibold px-5 py-3 text-sm disabled:opacity-60', 'Guardar corrección');
      bGuardar.type = 'submit';
      const bCancelar = nodo('button', 'rounded-xl bg-white border border-slate-300 text-slate-700 font-semibold px-5 py-3 text-sm', 'Cancelar');
      bCancelar.type = 'button';
      bCancelar.onclick = () => { state.liqd.editando = ''; renderLiqDetalle(); };
      botones.append(bGuardar, bCancelar);
      form.appendChild(botones);
      form.onsubmit = async ev => {
        ev.preventDefault();
        error.hidden = true;
        bGuardar.disabled = true;
        try {
          await ajusteDetalle({ action: 'liq_corregir', clave: r.clave, columna: it.columna, valor: inpValor.value.trim(), motivo: inpMotivo.value.trim() });
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
        } finally {
          if (form.isConnected) bGuardar.disabled = false;
        }
      };
      setTimeout(() => { form.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); inpValor.focus(); }, 0);
      li.appendChild(form);
      return li;
    }

    // ---------- Cruce: lo declarado por cada colaboradora vs lo contado ----------
    const CRUCE_TEXTO = {
      coincide: 'Coincide',
      diferencia: 'No coincide',
      sinContar: 'No se contó',
      sinDeclarar: 'No lo declaró',
    };
    const aRevisarCruce = p => p.estado !== 'coincide' && !p.revisado;

    function mountCruce() {
      if (state.session.debeCambiarPin) { location.hash = '#/cambiar-pin'; return mountCambiarPin(); }
      if (!puedeContar()) { location.hash = '#/'; return mountHome(); }

      showHeader(true);
      setHeader({ back: true, subtitle: 'Cruce con lo declarado' });
      const main = document.getElementById('main');
      main.innerHTML = '';
      main.appendChild(document.getElementById('tplCruce').content.cloneNode(true));

      if (!state.cruce.mes) state.cruce.mes = state.liq.mes || mesActualISO();
      const sel = document.getElementById('crMes');
      const hoy = new Date();
      for (let i = 0; i < 12; i++) {
        const iso = formatFechaISO(new Date(hoy.getFullYear(), hoy.getMonth() - i, 1)).slice(0, 7);
        const o = nodo('option', null, nombreMes(iso));
        o.value = iso;
        sel.appendChild(o);
      }
      sel.value = state.cruce.mes;
      if (sel.value !== state.cruce.mes) state.cruce.mes = sel.value;
      sel.addEventListener('change', () => { state.cruce.mes = sel.value; state.cruce.editando = null; cargarCruce(); });
      const buscar = document.getElementById('crBuscar');
      buscar.value = state.cruce.buscar;
      buscar.addEventListener('input', () => { state.cruce.buscar = buscar.value.trim().toLowerCase(); renderCruce(); });
      document.getElementById('crVerRevisar').onclick = () => { state.cruce.soloRevisar = true; renderCruce(); };
      document.getElementById('crVerTodo').onclick = () => { state.cruce.soloRevisar = false; renderCruce(); };
      state.cruce.editando = null;
      cargarCruce();
    }

    async function cargarCruce() {
      if (!state.cruce.datos || state.cruce.datos.mes !== state.cruce.mes) {
        document.getElementById('crLista').innerHTML = '';
        document.getElementById('crResumen').hidden = true;
        estadoEn('crEstado', 'Comparando lo declarado con lo contado…', true);
      }
      try {
        state.cruce.datos = await api({ action: 'cruce', mes: state.cruce.mes });
        document.getElementById('crEstado').hidden = true;
        renderCruce();
      } catch (err) {
        estadoEn('crEstado', err.message);
      }
    }

    function renderCruce() {
      const lista = document.getElementById('crLista');
      const D = state.cruce.datos;
      if (!lista || !D) return;
      for (const [id, activo] of [['crVerRevisar', state.cruce.soloRevisar], ['crVerTodo', !state.cruce.soloRevisar]]) {
        const b = document.getElementById(id);
        b.setAttribute('aria-pressed', String(activo));
        b.className = 'rounded-xl py-3 text-sm font-semibold ' + (activo ? 'bg-brand-700 text-white' : 'bg-white border border-slate-300 text-slate-700');
      }

      const R = D.resumen;
      const res = document.getElementById('crResumen');
      res.innerHTML = '';
      const dato = (titulo, valor, sub, alerta) => {
        const d = nodo('div', 'rounded-2xl border p-3 text-center ' + (alerta ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-200'));
        d.appendChild(nodo('div', 'text-xs uppercase tracking-wide text-slate-500', titulo));
        d.appendChild(nodo('div', 'text-lg font-bold text-slate-900', valor));
        if (sub) d.appendChild(nodo('div', 'text-xs text-slate-500', sub));
        res.appendChild(d);
      };
      dato('Días contados', num(R.diasConConteo), 'colaboradora × día');
      dato('Coinciden', num(R.coinciden), 'productos');
      dato('Para revisar', num(R.aRevisar), R.revisados ? num(R.revisados) + ' ya revisados' : '', R.aRevisar > 0);
      dato('Unidades', num(R.unidadesContadas) + ' / ' + num(R.unidadesDeclaradas), 'contadas / declaradas');
      res.hidden = false;
      const sinConteo = document.getElementById('crSinConteo');
      sinConteo.textContent = R.diasSinConteo
        ? R.diasSinConteo + ' días con producción declarada todavía no tienen conteo: no se comparan.'
        : '';
      sinConteo.hidden = !R.diasSinConteo;

      lista.innerHTML = '';
      if (D.cerrado) lista.appendChild(nodo('p', 'rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-sm text-emerald-900',
        mesTitulo(D.mes) + ' está cerrado: el cruce se puede ver, pero ya no se resuelve.'));
      const q = state.cruce.buscar;
      const dias = D.dias.filter(d => (!q || d.persona.toLowerCase().includes(q)) && (!state.cruce.soloRevisar || d.productos.some(aRevisarCruce)));
      if (!dias.length) {
        lista.appendChild(nodo('p', 'text-center py-10 text-slate-500', !D.dias.length
          ? 'Todavía no hay conteos de ' + nombreMes(D.mes) + ' para comparar.'
          : state.cruce.soloRevisar ? 'No queda nada para revisar. ' + (q ? '' : 'Todo lo contado coincide o ya está revisado.') : 'No hay colaboradoras que coincidan con la búsqueda.'));
        return;
      }
      for (const d of dias) lista.appendChild(tarjetaCruce(d, D));
    }

    function tarjetaCruce(d, D) {
      const card = nodo('article', 'bg-white rounded-2xl border border-slate-200 shadow-card p-4');
      const head = nodo('header', 'flex items-start justify-between gap-3');
      const tit = nodo('div', 'min-w-0');
      tit.appendChild(nodo('h2', 'font-semibold text-slate-900 break-words', d.persona));
      tit.appendChild(nodo('p', 'text-sm text-slate-600', formatFechaLegible(d.fecha) + ' · ' + d.canastos + (d.canastos === 1 ? ' canasto contado' : ' canastos contados')));
      head.appendChild(tit);
      const n = d.productos.filter(aRevisarCruce).length;
      head.appendChild(nodo('span', 'shrink-0 rounded-full px-3 py-1 text-xs font-semibold ' + (n ? 'bg-amber-100 text-amber-900' : 'bg-emerald-100 text-emerald-900'),
        n ? n + ' para revisar' : 'Todo bien'));
      card.appendChild(head);
      if (!d.declaro) card.appendChild(nodo('p', 'mt-2 text-sm font-semibold text-amber-800', 'No cargó su producción ese día en el formulario.'));
      const ul = nodo('ul', 'mt-2 border-t border-slate-100 divide-y divide-slate-100');
      for (const p of d.productos) ul.appendChild(lineaCruce(d, p, D));
      card.appendChild(ul);
      return card;
    }

    function lineaCruce(d, p, D) {
      const li = nodo('li', 'py-2 text-sm');
      const fila = nodo('div', 'flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1');
      fila.appendChild(nodo('span', 'min-w-0 flex-1 break-words text-slate-800', p.producto));
      const dif = p.contado - p.declarado;
      const nums = nodo('span', 'shrink-0 text-slate-700');
      nums.textContent = 'Declaró ' + num(p.declarado) + ' · contó ' + num(p.contado);
      fila.appendChild(nums);
      li.appendChild(fila);

      const pie = nodo('div', 'mt-1 flex flex-wrap items-center gap-x-3 gap-y-1');
      const colorEstado = p.estado === 'coincide' ? 'text-emerald-700' : p.revisado ? 'text-slate-600' : 'text-amber-800';
      let txt = CRUCE_TEXTO[p.estado] + (dif && p.declarado && p.contado ? ' (' + (dif > 0 ? '+' : '') + num(dif) + ')' : '');
      if (p.estado === 'coincide' && p.corregido) txt += ' · corregido según el conteo';
      pie.appendChild(nodo('span', 'text-xs font-semibold ' + colorEstado, txt));
      li.appendChild(pie);

      if (p.revisado) {
        li.appendChild(nodo('p', 'text-xs text-slate-600 mt-0.5 break-words', 'Revisado: queda lo declarado · ' + p.revisado.motivo + ' (' + p.revisado.quien + ')'));
      } else if (p.estado === 'sinDeclarar') {
        li.appendChild(nodo('p', 'text-xs text-slate-600 mt-0.5', 'Fijate si lo cargó con otra fecha o como otro producto: ahí lo podés corregir desde la liquidación.'));
      }

      const puede = D.puedeAjustar && !D.cerrado && p.estado !== 'coincide';
      if (!puede) return li;
      const ed = state.cruce.editando;
      if (ed && ed.persona === d.persona && ed.fecha === d.fecha && ed.producto === p.producto) {
        li.appendChild(editorCruce(d, p, ed.accion));
        return li;
      }
      const acciones = nodo('div', 'flex flex-wrap gap-x-4');
      const abrir = accion => () => { state.cruce.editando = { persona: d.persona, fecha: d.fecha, producto: p.producto, accion }; renderCruce(); };
      if (p.revisado) {
        const b = botonChico('Deshacer la revisión', async () => {
          b.disabled = true;
          await accionCruce({ action: 'cruce_deshacer', persona: d.persona, fecha: d.fecha, producto: p.producto }, b);
        }, 'text-slate-600');
        acciones.appendChild(b);
      } else {
        if (p.declarado > 0) acciones.appendChild(botonChico('Usar lo contado (' + num(p.contado) + ')', abrir('usar')));
        acciones.appendChild(botonChico(p.declarado > 0 ? 'Dejar lo declarado (' + num(p.declarado) + ')' : 'Dejar así', abrir('dejar'), 'text-slate-700'));
      }
      li.appendChild(acciones);
      return li;
    }

    function editorCruce(d, p, accion) {
      const usar = accion === 'usar';
      const form = nodo('form', 'mt-2 rounded-xl border border-brand-200 bg-brand-50 p-3 space-y-2');
      form.appendChild(nodo('p', 'text-sm text-slate-800', usar
        ? 'Se va a pagar ' + num(p.contado) + ' (lo contado) en vez de ' + num(p.declarado) + '. Queda como una corrección del registro, con el valor anterior.'
        : 'Se va a pagar ' + num(p.declarado) + ' (lo declarado) y la diferencia queda marcada como revisada.'));
      const lab = nodo('label', 'block');
      lab.appendChild(nodo('span', 'text-xs font-medium text-slate-500 uppercase tracking-wide', 'Motivo'));
      const inp = nodo('input', LP_INPUT);
      inp.type = 'text';
      inp.value = usar ? 'Según el conteo de la contadora' : '';
      inp.placeholder = usar ? '' : 'Ej.: ese producto no pasa por la contadora';
      lab.appendChild(inp);
      form.appendChild(lab);
      const error = nodo('p', 'text-sm font-semibold text-red-700');
      error.hidden = true;
      form.appendChild(error);
      const botones = nodo('div', 'flex flex-wrap gap-2');
      const bOk = nodo('button', 'rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-semibold px-5 py-3 text-sm disabled:opacity-60',
        usar ? 'Pagar lo contado' : 'Dejar lo declarado');
      bOk.type = 'submit';
      const bNo = nodo('button', 'rounded-xl bg-white border border-slate-300 text-slate-700 font-semibold px-5 py-3 text-sm', 'Cancelar');
      bNo.type = 'button';
      bNo.onclick = () => { state.cruce.editando = null; renderCruce(); };
      botones.append(bOk, bNo);
      form.appendChild(botones);
      form.onsubmit = async ev => {
        ev.preventDefault();
        error.hidden = true;
        bOk.disabled = true;
        const params = { action: usar ? 'cruce_usar_contado' : 'cruce_dejar_declarado', persona: d.persona, fecha: d.fecha, producto: p.producto, motivo: inp.value.trim() };
        const r = await accionCruce(params, bOk);
        if (r && r.error) { error.textContent = r.error; error.hidden = false; }
      };
      setTimeout(() => { form.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); inp.focus(); }, 0);
      return form;
    }

    // Resolver una diferencia y volver a comparar; la liquidación del mes se recalcula al volver a ella
    async function accionCruce(params, boton) {
      try {
        const r = await api(params);
        state.cruce.editando = null;
        state.liq.datos = null;
        await cargarCruce();
        avisoFlotante('crAviso', r.aviso);
        return r;
      } catch (err) {
        if (boton && boton.isConnected) boton.disabled = false;
        if (!state.cruce.editando) avisoFlotante('crAviso', err.message, true);
        return { error: err.message };
      }
    }

    // ---------- Precios y parámetros (lo que antes se cambiaba en el Excel) ----------
    const LP_INPUT = 'mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500';
    function mesTitulo(mesISO) {
      if (!/^\d{4}-\d{2}$/.test(mesISO || '')) return mesISO || '(sin mes)';
      const t = nombreMes(mesISO);
      return t.charAt(0).toUpperCase() + t.slice(1);
    }
    const mesAnterior = mesISO => {
      const [y, m] = mesISO.split('-').map(Number);
      return formatFechaISO(new Date(y, m - 2, 1)).slice(0, 7);
    };
    const porNombre = (a, b) => a.localeCompare(b, 'es');

    function mountLiqParametros() {
      if (state.session.debeCambiarPin) { location.hash = '#/cambiar-pin'; return mountCambiarPin(); }
      if (!esGestion()) { location.hash = '#/'; return mountHome(); }

      showHeader(true);
      setHeader({ back: true, subtitle: 'Precios y parámetros' });
      document.getElementById('btnBack').onclick = () => (location.hash = '#/liquidacion');
      const main = document.getElementById('main');
      main.innerHTML = '';
      main.appendChild(document.getElementById('tplLiqParametros').content.cloneNode(true));
      const pendiente = state.liqp.pendiente || {};
      state.liqp.pendiente = null;
      state.liqp.editando = pendiente.editando || '';
      state.liqp.prefijo = pendiente.prefijo || {};
      if (!state.liqp.mesFijos) state.liqp.mesFijos = state.liq.mes;
      cargarLiqParametros();
    }

    async function cargarLiqParametros() {
      estadoEn('lpEstado', 'Cargando…', true);
      try {
        state.liqp.datos = await api({ action: 'liq_tablas' });
        document.getElementById('lpEstado').hidden = true;
        renderLiqParametros();
      } catch (err) {
        estadoEn('lpEstado', 'No se pudo cargar: ' + err.message);
      }
    }

    // Guarda un cambio: el backend devuelve las tablas ya actualizadas y se redibuja todo
    async function cambioLiq(params) {
      const data = await api(params);
      state.liqp.datos = data;
      state.liqp.editando = '';
      state.liqp.prefijo = {};
      state.liq.datos = null;  // la liquidación se vuelve a calcular con los valores nuevos
      renderLiqParametros();
      const aviso = document.getElementById('lpAviso');
      if (!aviso) return;
      aviso.textContent = data.aviso || 'Guardado.';
      aviso.hidden = false;
      clearTimeout(cambioLiq.timer);
      cambioLiq.timer = setTimeout(() => (aviso.hidden = true), 4000);
    }
    const lpGuardar = (tabla, fila) => vals => cambioLiq({
      action: 'liq_guardar', tabla, fila: fila ? fila.fila : '', datos: JSON.stringify(vals), antes: fila ? JSON.stringify(fila) : '',
    });
    const lpBorrar = (tabla, fila, pregunta) => async () => {
      if (!confirm(pregunta)) return;
      await cambioLiq({ action: 'liq_borrar', tabla, fila: fila.fila, antes: JSON.stringify(fila) });
    };
    function lpEditar(clave, prefijo) {
      state.liqp.editando = clave;
      state.liqp.prefijo = prefijo || {};
      renderLiqParametros();
    }

    function renderLiqParametros() {
      const cont = document.getElementById('lpSecciones');
      const D = state.liqp.datos;
      if (!cont || !D) return;
      const T = D.tablas;
      const sinGrupo = T.productos.filter(p => !p.grupo).length;
      const mesF = state.liqp.mesFijos || state.liq.mes;
      const faltanDias = !T.diasLaborales.some(d => d.mes === state.liq.mes);
      const secciones = [
        ['valores', 'Valor de la hora', pesos(D.valorHora) + ' · ' + pesos(D.valorHoraTrabajo), lpValores],
        ['grupos', 'Grupos y unidades por hora', String(T.grupos.length), lpGrupos],
        ['productos', 'Productos', T.productos.length + (sinGrupo ? ' · ' + sinGrupo + ' sin grupo' : ''), lpProductos],
        ['montosFijos', 'Montos fijos', mesTitulo(mesF) + ': ' + T.montosFijos.filter(m => m.mes === mesF).length, lpMontosFijos],
        ['diasLaborales', 'Días laborales', faltanDias ? 'falta ' + nombreMes(state.liq.mes) : T.diasLaborales.length + ' meses', lpDiasLaborales],
        ['colaboradoras', 'Colaboradoras', String(T.colaboradoras.length), lpColaboradoras],
        ['historial', 'Últimos cambios', '', lpHistorial],
      ];
      cont.innerHTML = '';
      for (const [id, titulo, resumen, pintar] of secciones) {
        const det = nodo('details', 'desplegable bg-white rounded-2xl border border-slate-200 shadow-card');
        det.open = state.liqp.abiertas.has(id);
        det.addEventListener('toggle', () => (det.open ? state.liqp.abiertas.add(id) : state.liqp.abiertas.delete(id)));
        const sum = nodo('summary', 'flex items-center gap-3 p-4 cursor-pointer');
        sum.appendChild(nodo('span', 'flecha inline-block text-xl leading-none text-slate-400', '›'));
        sum.appendChild(nodo('span', 'flex-1 min-w-0 font-semibold text-slate-900', titulo));
        if (resumen) sum.appendChild(nodo('span', 'text-xs text-right shrink-0 ' + (/sin grupo|falta/.test(resumen) ? 'font-semibold text-amber-700' : 'text-slate-500'), resumen));
        det.appendChild(sum);
        const body = nodo('div', 'px-4 pb-4');
        pintar(body, D);
        det.appendChild(body);
        cont.appendChild(det);
      }
    }

    // Una fila: el dato y «Cambiar»; si es la que se está editando, el formulario en su lugar
    function lpFila(cont, clave, pintar, editor, cerrado) {
      if (state.liqp.editando === clave && !cerrado) { cont.appendChild(editor()); return; }
      const fila = nodo('div', 'flex items-center justify-between gap-3 py-2 border-t border-slate-100');
      const izq = nodo('div', 'min-w-0 text-sm');
      pintar(izq);
      fila.appendChild(izq);
      if (cerrado) {
        fila.appendChild(nodo('span', 'shrink-0 text-xs font-semibold text-slate-500 px-2', 'Mes cerrado'));
      } else {
        const btn = nodo('button', 'shrink-0 text-sm font-semibold text-brand-700 underline min-h-[44px] px-2', 'Cambiar');
        btn.type = 'button';
        btn.onclick = () => lpEditar(clave);
        fila.appendChild(btn);
      }
      cont.appendChild(fila);
    }

    function lpAgregar(cont, clave, texto, editor) {
      if (state.liqp.editando === clave) { cont.appendChild(editor()); return; }
      const btn = nodo('button', 'my-2 w-full rounded-xl border border-dashed border-brand-500 text-brand-700 font-semibold py-3 text-sm', '+ ' + texto);
      btn.type = 'button';
      btn.onclick = () => lpEditar(clave);
      cont.appendChild(btn);
    }

    // Cartel con lo que falta cargar y un «Agregar» para cada uno
    function lpFaltantes(cont, titulo, nombres, clave, campo) {
      if (!nombres.length) return;
      const caja = nodo('div', 'my-2 rounded-xl bg-amber-50 border border-amber-200 p-3 text-sm text-amber-900');
      caja.appendChild(nodo('p', 'font-semibold', titulo + ' (' + nombres.length + '):'));
      for (const n of nombres) {
        const fila = nodo('div', 'flex items-center justify-between gap-3');
        fila.appendChild(nodo('span', 'min-w-0 break-words', n));
        const b = nodo('button', 'shrink-0 font-semibold underline min-h-[44px] px-2', 'Agregar');
        b.type = 'button';
        b.onclick = () => lpEditar(clave, { [campo]: n });
        fila.appendChild(b);
        caja.appendChild(fila);
      }
      cont.appendChild(caja);
    }

    /**
     * Formulario de una fila.
     * campos: [{ k, label, tipo: 'texto' | 'numero' | 'mes' | 'select', opciones: [[valor, texto]], lista: [sugerencias], ayuda }]
     * guardar(valores) y borrar() devuelven promesas; si fallan, el error se muestra en el formulario.
     */
    function lpEditor(titulo, campos, valores, guardar, borrar) {
      const form = nodo('form', 'my-2 rounded-xl border border-brand-200 bg-brand-50 p-3 space-y-3');
      if (titulo) form.appendChild(nodo('p', 'text-sm font-semibold text-slate-900 break-words', titulo));
      const inputs = {};
      for (const c of campos) {
        const lab = nodo('label', 'block');
        lab.appendChild(nodo('span', 'text-xs font-medium text-slate-500 uppercase tracking-wide', c.label));
        let inp;
        if (c.tipo === 'select') {
          inp = nodo('select', LP_INPUT);
          for (const [v, txt] of c.opciones) {
            const o = nodo('option', null, txt);
            o.value = v;
            inp.appendChild(o);
          }
        } else {
          inp = nodo('input', LP_INPUT);
          inp.type = c.tipo === 'mes' ? 'month' : 'text';
          if (c.tipo === 'numero') inp.inputMode = 'decimal';
          if (c.lista && c.lista.length) {
            const dl = nodo('datalist');
            dl.id = 'lpLista' + Math.random().toString(36).slice(2);
            for (const v of c.lista) {
              const o = nodo('option');
              o.value = v;
              dl.appendChild(o);
            }
            lab.appendChild(dl);
            inp.setAttribute('list', dl.id);
          }
        }
        inp.value = valores[c.k] == null ? '' : valores[c.k];
        inputs[c.k] = inp;
        lab.appendChild(inp);
        if (c.ayuda) lab.appendChild(nodo('span', 'block text-xs text-slate-500 mt-1', c.ayuda));
        form.appendChild(lab);
      }
      const error = nodo('p', 'text-sm font-semibold text-red-700');
      error.hidden = true;
      form.appendChild(error);

      const conEspera = async (fn, boton, txt) => {
        error.hidden = true;
        const original = boton.textContent;
        boton.disabled = true;
        boton.textContent = txt;
        try {
          await fn();
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
        } finally {
          // Si se guardó, el formulario ya no está (se redibujó); si no, vuelve a quedar usable
          if (form.isConnected) { boton.disabled = false; boton.textContent = original; }
        }
      };
      const botones = nodo('div', 'flex flex-wrap items-center gap-2');
      const bGuardar = nodo('button', 'rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-semibold px-5 py-3 text-sm disabled:opacity-60', 'Guardar');
      bGuardar.type = 'submit';
      const bCancelar = nodo('button', 'rounded-xl bg-white border border-slate-300 text-slate-700 font-semibold px-5 py-3 text-sm', 'Cancelar');
      bCancelar.type = 'button';
      bCancelar.onclick = () => lpEditar('');
      botones.append(bGuardar, bCancelar);
      if (borrar) {
        const bBorrar = nodo('button', 'ml-auto text-sm font-semibold text-red-700 underline min-h-[44px] px-2 disabled:opacity-60', 'Borrar');
        bBorrar.type = 'button';
        bBorrar.onclick = () => conEspera(borrar, bBorrar, 'Borrando…');
        botones.appendChild(bBorrar);
      }
      form.appendChild(botones);
      form.onsubmit = ev => {
        ev.preventDefault();
        const vals = {};
        for (const k of Object.keys(inputs)) vals[k] = inputs[k].value.trim();
        conEspera(() => guardar(vals), bGuardar, 'Guardando…');
      };
      setTimeout(() => form.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 0);
      return form;
    }

    function lpValores(body, D) {
      const textos = {
        valor_hora_produccion: ['Hora de producción', 'Base del precio por unidad: este valor ÷ las unidades por hora del grupo. Si lo cambiás, cambian todos los precios.'],
        valor_hora_trabajo: ['Hora de trabajo', 'Lo que se paga por cada hora de corte, control, ADM/calidad, etc.'],
        horas_minimas_por_dia: ['Horas mínimas por día', 'Para calcular las horas faltantes del mes. Es informativo: no cambia lo que se paga.'],
      };
      const enPesos = p => p.clave !== 'horas_minimas_por_dia';
      for (const p of D.tablas.parametros) {
        const [titulo, ayuda] = textos[p.clave] || [p.descripcion || p.clave, ''];
        lpFila(body, 'parametros:' + p.fila, izq => {
          izq.appendChild(nodo('div', 'font-semibold text-slate-900', titulo + ': ' + (enPesos(p) ? pesos(p.valor) : n2(p.valor) + ' h')));
          if (ayuda) izq.appendChild(nodo('div', 'text-xs text-slate-500 mt-0.5', ayuda));
        }, () => lpEditor(titulo, [{ k: 'valor', label: enPesos(p) ? 'Valor en pesos' : 'Horas', tipo: 'numero', ayuda }], p, lpGuardar('parametros', p)));
      }
    }

    function camposGrupo(D) {
      return [
        { k: 'grupo', label: 'Nombre del grupo' },
        { k: 'categoria', label: 'Categoría', lista: [...new Set(D.tablas.grupos.map(g => g.categoria).filter(Boolean))] },
        { k: 'unidades_por_hora', label: 'Unidades por hora', tipo: 'numero', ayuda: 'El precio por unidad es ' + pesos(D.valorHora) + ' ÷ este número.' },
        { k: 'observaciones', label: 'Observaciones' },
      ];
    }

    function lpGrupos(body, D) {
      body.appendChild(nodo('p', 'text-xs text-slate-500 pb-1', 'Cuántas unidades se hacen en una hora. De ahí sale el precio por unidad de todos los productos del grupo.'));
      lpAgregar(body, 'grupos:nuevo', 'Agregar grupo', () => lpEditor('Grupo nuevo', camposGrupo(D), {}, lpGuardar('grupos', null)));
      const porCategoria = new Map();
      for (const g of D.tablas.grupos) {
        const c = g.categoria || 'SIN CATEGORÍA';
        if (!porCategoria.has(c)) porCategoria.set(c, []);
        porCategoria.get(c).push(g);
      }
      for (const [cat, grupos] of porCategoria) {
        body.appendChild(nodo('h3', 'pt-3 pb-1 text-xs font-semibold text-brand-700 uppercase tracking-wide', cat));
        for (const g of grupos) {
          lpFila(body, 'grupos:' + g.fila, izq => {
            izq.appendChild(nodo('div', 'font-medium text-slate-900 break-words', g.grupo));
            izq.appendChild(nodo('div', 'text-xs text-slate-500', num(g.unidades_por_hora) + ' por hora → ' + precioUnidad(g.precio) + ' c/u · ' +
              g.productos + (g.productos === 1 ? ' producto' : ' productos') + (g.observaciones ? ' · ' + g.observaciones : '')));
            if (g.repetido) izq.appendChild(nodo('div', 'text-xs font-semibold text-amber-700', 'Nombre repetido: para los precios se usa el de más arriba.'));
          }, () => lpEditor(g.grupo, camposGrupo(D), g, lpGuardar('grupos', g),
            lpBorrar('grupos', g, '¿Borrar el grupo «' + g.grupo + '»?')));
        }
      }
    }

    function camposProducto(D) {
      const opciones = [['', 'Sin grupo (se paga $ 0)']];
      for (const g of D.tablas.grupos) if (!g.repetido) opciones.push([g.grupo, g.grupo + ' · ' + precioUnidad(g.precio)]);
      return [
        { k: 'producto', label: 'Producto (tal cual figura en el formulario)', lista: D.productosFormulario },
        { k: 'grupo', label: 'Grupo', tipo: 'select', opciones },
        { k: 'multiplicador', label: 'Multiplicador', tipo: 'numero', ayuda: 'Vacío o 1: el precio del grupo. Ej.: EMPAQUETADO X2 lleva 2 (paga el doble).' },
      ];
    }

    function lpProductos(body, D) {
      lpFaltantes(body, 'Están en el formulario y no tienen precio', D.productosFormulario, 'productos:nuevo', 'producto');
      lpAgregar(body, 'productos:nuevo', 'Agregar producto',
        () => lpEditor('Producto nuevo', camposProducto(D), state.liqp.prefijo, lpGuardar('productos', null)));

      const sinGrupo = D.tablas.productos.filter(p => !p.grupo).length;
      const filtros = nodo('div', 'flex gap-2 items-center py-2');
      const buscar = nodo('input', LP_INPUT.replace('mt-1 ', ''));
      buscar.type = 'search';
      buscar.placeholder = 'Buscar producto';
      buscar.value = state.liqp.buscarProd;
      filtros.appendChild(buscar);
      if (sinGrupo || state.liqp.soloSinGrupo) {
        const activo = state.liqp.soloSinGrupo;
        const b = nodo('button', 'shrink-0 rounded-xl px-3 py-3 text-sm font-semibold ' +
          (activo ? 'bg-amber-600 text-white' : 'bg-amber-50 border border-amber-200 text-amber-800'), 'Sin grupo (' + sinGrupo + ')');
        b.type = 'button';
        b.setAttribute('aria-pressed', String(activo));
        b.onclick = () => { state.liqp.soloSinGrupo = !activo; renderLiqParametros(); };
        filtros.appendChild(b);
      }
      body.appendChild(filtros);

      const lista = nodo('div');
      body.appendChild(lista);
      const pintar = () => {
        lista.innerHTML = '';
        const q = state.liqp.buscarProd.toLowerCase();
        const prods = D.tablas.productos
          .filter(p => (!state.liqp.soloSinGrupo || !p.grupo) && (!q || p.producto.toLowerCase().includes(q)))
          .sort((a, b) => porNombre(a.producto, b.producto));
        if (!prods.length) lista.appendChild(nodo('p', 'py-4 text-sm text-slate-500 text-center', 'No hay productos que coincidan.'));
        for (const p of prods) {
          lpFila(lista, 'productos:' + p.fila, izq => {
            izq.appendChild(nodo('div', 'font-medium text-slate-900 break-words', p.producto));
            izq.appendChild(p.grupo
              ? nodo('div', 'text-xs text-slate-500', p.grupo + (p.multiplicador ? ' × ' + p.multiplicador : '') + ' → ' + precioUnidad(p.precio) + ' c/u')
              : nodo('div', 'text-xs font-semibold text-amber-700', 'Sin grupo: se paga $ 0'));
          }, () => lpEditor(p.producto, camposProducto(D), p, lpGuardar('productos', p),
            lpBorrar('productos', p, '¿Sacar «' + p.producto + '» de la lista de precios? Si alguien lo carga, va a aparecer en «Para revisar».')));
        }
      };
      buscar.addEventListener('input', () => { state.liqp.buscarProd = buscar.value.trim(); pintar(); });
      pintar();
    }

    function camposFijo(D) {
      const personas = D.tablas.colaboradoras.map(c => c.nombre_completo).sort(porNombre);
      return [
        { k: 'persona', label: 'Colaboradora', tipo: 'select', opciones: [['', 'Elegí…']].concat(personas.map(p => [p, p])) },
        { k: 'mes', label: 'Mes', tipo: 'mes' },
        { k: 'monto', label: 'Monto en pesos', tipo: 'numero' },
      ];
    }

    function lpMontosFijos(body, D) {
      const mes = state.liqp.mesFijos || state.liq.mes;
      body.appendChild(nodo('p', 'text-xs text-slate-500 pb-2', 'Lo que cobra por mes quien tiene un monto fijo (se suma a lo que haya cargado).'));
      const lab = nodo('label', 'block pb-2');
      lab.appendChild(nodo('span', 'text-xs font-medium text-slate-500 uppercase tracking-wide', 'Mes'));
      const inpMes = nodo('input', LP_INPUT);
      inpMes.type = 'month';
      inpMes.value = mes;
      inpMes.addEventListener('change', () => {
        if (!/^\d{4}-\d{2}$/.test(inpMes.value)) return;
        state.liqp.mesFijos = inpMes.value;
        lpEditar('');
      });
      lab.appendChild(inpMes);
      body.appendChild(lab);

      const cerrado = (D.mesesCerrados || []).includes(mes);
      if (cerrado) body.appendChild(nodo('p', 'pb-2 text-sm font-semibold text-slate-600', mesTitulo(mes) + ' está cerrado: estos montos quedaron guardados con el cierre.'));
      const delMes = D.tablas.montosFijos.filter(m => m.mes === mes).sort((a, b) => porNombre(a.persona, b.persona));
      if (!delMes.length) body.appendChild(nodo('p', 'py-2 text-sm text-slate-500', 'No hay montos fijos cargados en ' + nombreMes(mes) + '.'));
      for (const m of delMes) {
        lpFila(body, 'montosFijos:' + m.fila, izq => {
          izq.appendChild(nodo('div', 'font-medium text-slate-900 break-words', m.persona));
          izq.appendChild(nodo('div', 'text-xs text-slate-500', pesos(m.monto)));
        }, () => lpEditor(m.persona + ' · ' + mesTitulo(m.mes), camposFijo(D), m, lpGuardar('montosFijos', m),
          lpBorrar('montosFijos', m, '¿Borrar el monto fijo de ' + m.persona + ' en ' + nombreMes(m.mes) + '?')), cerrado);
      }
      if (delMes.length) {
        body.appendChild(nodo('p', 'pt-2 border-t border-slate-100 text-sm font-semibold text-slate-900 text-right',
          'Total: ' + pesos(delMes.reduce((s, m) => s + Number(m.monto), 0))));
      }

      // Se repiten casi todos los meses: copiar los del mes anterior ahorra cargarlos uno por uno
      const ant = mesAnterior(mes);
      const yaTienen = new Set(delMes.map(m => m.persona.toLowerCase()));
      const copiables = D.tablas.montosFijos.filter(m => m.mes === ant && !yaTienen.has(m.persona.toLowerCase()));
      if (copiables.length && !cerrado) {
        const b = nodo('button', 'mt-2 w-full rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-semibold py-3 text-sm disabled:opacity-60',
          'Copiar los de ' + nombreMes(ant) + ' (' + copiables.length + ')');
        b.type = 'button';
        const err = nodo('p', 'text-sm font-semibold text-red-700 mt-1');
        err.hidden = true;
        b.onclick = async () => {
          if (!confirm('¿Copiar a ' + nombreMes(mes) + ' los ' + copiables.length + ' montos fijos de ' + nombreMes(ant) + '? Después podés cambiar cada uno.')) return;
          b.disabled = true;
          try {
            await cambioLiq({ action: 'liq_copiar_fijos', mes });
          } catch (e) {
            err.textContent = e.message;
            err.hidden = false;
            b.disabled = false;
          }
        };
        body.append(b, err);
      }
      if (!cerrado) {
        lpAgregar(body, 'montosFijos:nuevo', 'Agregar monto fijo',
          () => lpEditor('Monto fijo nuevo', camposFijo(D), Object.assign({ mes }, state.liqp.prefijo), lpGuardar('montosFijos', null)));
      }

      const otros = [...new Set(D.tablas.montosFijos.map(m => m.mes))].filter(x => x !== mes).sort().reverse();
      if (otros.length) {
        const caja = nodo('div', 'pt-3');
        caja.appendChild(nodo('p', 'text-xs font-medium text-slate-500 uppercase tracking-wide pb-1', 'Otros meses con montos fijos'));
        const chips = nodo('div', 'flex flex-wrap gap-2');
        for (const x of otros) {
          const c = nodo('button', 'rounded-full bg-slate-100 text-slate-700 text-sm px-3 py-2', mesTitulo(x));
          c.type = 'button';
          c.onclick = () => { state.liqp.mesFijos = x; lpEditar(''); };
          chips.appendChild(c);
        }
        caja.appendChild(chips);
        body.appendChild(caja);
      }
    }

    const camposDias = () => [{ k: 'mes', label: 'Mes', tipo: 'mes' }, { k: 'dias', label: 'Días laborales', tipo: 'numero' }];

    function lpDiasLaborales(body, D) {
      body.appendChild(nodo('p', 'text-xs text-slate-500 pb-1', 'Se usan para calcular inasistencias y horas faltantes. No cambian lo que se paga.'));
      lpAgregar(body, 'diasLaborales:nuevo', 'Agregar mes',
        () => lpEditor('Mes nuevo', camposDias(), Object.assign({ mes: state.liq.mes }, state.liqp.prefijo), lpGuardar('diasLaborales', null)));
      const cerrados = D.mesesCerrados || [];
      for (const d of D.tablas.diasLaborales.slice().sort((a, b) => b.mes.localeCompare(a.mes))) {
        lpFila(body, 'diasLaborales:' + d.fila, izq => {
          izq.appendChild(nodo('span', 'font-medium text-slate-900', mesTitulo(d.mes) + ': '));
          izq.appendChild(document.createTextNode(d.dias + ' días'));
        }, () => lpEditor(mesTitulo(d.mes), camposDias(), d, lpGuardar('diasLaborales', d),
          lpBorrar('diasLaborales', d, '¿Borrar los días laborales de ' + nombreMes(d.mes) + '?')), cerrados.includes(d.mes));
      }
    }

    const camposColab = () => [
      { k: 'nombre_completo', label: 'Apellido, Nombre (igual que en el formulario)' },
      { k: 'dni', label: 'DNI', tipo: 'numero' },
    ];

    function lpColaboradoras(body, D) {
      body.appendChild(nodo('p', 'text-xs text-slate-500 pb-1', 'Las que aparecen en la liquidación y en el resumen para Melina, con su DNI.'));
      lpFaltantes(body, 'Tienen usuario en la app y no están en la liquidación', D.personasSinListar, 'colaboradoras:nuevo', 'nombre_completo');
      lpAgregar(body, 'colaboradoras:nuevo', 'Agregar colaboradora',
        () => lpEditor('Colaboradora nueva', camposColab(), state.liqp.prefijo, lpGuardar('colaboradoras', null)));

      const buscar = nodo('input', LP_INPUT.replace('mt-1 ', 'my-2 '));
      buscar.type = 'search';
      buscar.placeholder = 'Buscar colaboradora';
      buscar.value = state.liqp.buscarCol;
      body.appendChild(buscar);
      const lista = nodo('div');
      body.appendChild(lista);
      const pintar = () => {
        lista.innerHTML = '';
        const q = state.liqp.buscarCol.toLowerCase();
        const cols = D.tablas.colaboradoras.filter(c => !q || c.nombre_completo.toLowerCase().includes(q))
          .sort((a, b) => porNombre(a.nombre_completo, b.nombre_completo));
        if (!cols.length) lista.appendChild(nodo('p', 'py-4 text-sm text-slate-500 text-center', 'No hay colaboradoras que coincidan.'));
        for (const c of cols) {
          lpFila(lista, 'colaboradoras:' + c.fila, izq => {
            izq.appendChild(nodo('div', 'font-medium text-slate-900 break-words', c.nombre_completo));
            izq.appendChild(c.dni
              ? nodo('div', 'text-xs text-slate-500', 'DNI ' + Number(c.dni).toLocaleString('es-AR'))
              : nodo('div', 'text-xs font-semibold text-amber-700', 'Sin DNI'));
          }, () => lpEditor(c.nombre_completo, camposColab(), c, lpGuardar('colaboradoras', c),
            lpBorrar('colaboradoras', c, '¿Sacar a ' + c.nombre_completo + ' de la liquidación? Deja de aparecer en todos los meses, también los anteriores (hasta que exista «Cerrar mes»). Sus cargas no se borran.')));
        }
      };
      buscar.addEventListener('input', () => { state.liqp.buscarCol = buscar.value.trim(); pintar(); });
      pintar();
    }

    function lpHistorial(body, D) {
      if (!D.historial.length) {
        body.appendChild(nodo('p', 'text-sm text-slate-500', 'Todavía no hay cambios.'));
        return;
      }
      const ul = nodo('ul', 'divide-y divide-slate-100 text-sm');
      for (const h of D.historial) {
        const li = nodo('li', 'py-2');
        const cuando = /^\d{4}-\d{2}-\d{2}/.test(h.fecha) ? formatFechaCorta(h.fecha.slice(0, 10)) + ' ' + h.fecha.slice(11) : h.fecha;
        li.appendChild(nodo('div', 'text-xs text-slate-500', cuando + ' · ' + h.persona));
        li.appendChild(nodo('div', 'text-slate-800 break-words', h.detalle));
        ul.appendChild(li);
      }
      body.appendChild(ul);
    }

    // =====================================================================
    // API
    // =====================================================================
    async function apiRaw(params) {
      if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.startsWith('PONER_')) {
        throw new Error('Falta configurar APPS_SCRIPT_URL en index.html.');
      }
      const url = new URL(CONFIG.APPS_SCRIPT_URL);
      for (const [k, v] of Object.entries(params)) if (v != null) url.searchParams.set(k, v);
      const res = await fetch(url.toString(), { method: 'GET' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function api(params) {
      if (!state.session) throw new Error('Sin sesión');
      const withToken = Object.assign({ token: state.session.token }, params);
      const data = await apiRaw(withToken);
      if (!data.ok && data.code === 'AUTH_REQUIRED') {
        clearSession();
        location.hash = '#/';
        router();
        throw new Error('Tu sesión expiró. Volvé a entrar.');
      }
      if (!data.ok) throw new Error(data.error || 'Error del servidor');
      return data;
    }
  </script>
